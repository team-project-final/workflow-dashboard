name: Sync Workflow Data

on:
  schedule:
    # 매일 KST 09:00, 14:00, 19:00 (UTC 00:00, 05:00, 10:00)
    - cron: '0 0,5,10 * * *'
  workflow_dispatch:
    inputs:
      repos:
        description: '동기화할 레포 (콤마 구분, 비우면 전체)'
        required: false
        type: string
      force:
        description: '강제 동기화 (md5 우회 + history/changelog 재계산)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write  # Build & Deploy dispatch용

# 동시 실행 시 git push race condition 방지 (큐로 직렬화)
concurrency:
  group: sync-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dashboard
        uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sync repos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPOS: ${{ inputs.repos || '' }}
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          set -e

          ORG="team-project-final"
          DOCS_SUBDIR="docs/project-management"
          REPOS=("synapse-platform-svc" "synapse-engagement-svc" "synapse-knowledge-svc" "synapse-learning-svc" "synapse-frontend" "synapse-gitops" "synapse-shared")

          UPDATED=()

          for REPO in "${REPOS[@]}"; do
            # 선택된 레포만 처리 (콤마 구분)
            if [ -n "$TARGET_REPOS" ]; then
              echo ",$TARGET_REPOS," | grep -q ",$REPO," || { echo "⏭️ $REPO: not in selection — skip"; continue; }
            fi

            echo "::group::Syncing $REPO"

            # 기본 브랜치 확인 (fallback 용)
            DEFAULT_BRANCH=$(gh api "repos/$ORG/$REPO" --jq '.default_branch' 2>/dev/null || echo "")
            if [ -z "$DEFAULT_BRANCH" ]; then
              echo "⚠️ $REPO: 접근 불가 또는 존재하지 않음 — 건너뜀"
              echo "::endgroup::"
              continue
            fi

            # 모든 브랜치 중 일정문서가 있는, 가장 최근 commit branch 선택
            BRANCHES_BY_DATE=$(
              gh api "repos/$ORG/$REPO/branches" --paginate --jq '.[].name' 2>/dev/null | while read br; do
                d=$(gh api "repos/$ORG/$REPO/commits/$br" --jq '.commit.committer.date' 2>/dev/null)
                [ -n "$d" ] && echo "$d $br"
              done | sort -r | awk '{print $2}'
            )

            TARGET_BRANCH=""
            for br in $BRANCHES_BY_DATE; do
              if gh api "repos/$ORG/$REPO/contents/$DOCS_SUBDIR/workflow?ref=$br" --jq '.[0].name' >/dev/null 2>&1; then
                TARGET_BRANCH="$br"
                break
              fi
            done

            if [ -z "$TARGET_BRANCH" ]; then
              echo "⚠️ $REPO: 일정문서가 있는 브랜치 없음 — default($DEFAULT_BRANCH)로 fallback"
              TARGET_BRANCH="$DEFAULT_BRANCH"
            elif [ "$TARGET_BRANCH" != "$DEFAULT_BRANCH" ]; then
              echo "📍 $REPO: 대상 브랜치 = $TARGET_BRANCH (default: $DEFAULT_BRANCH)"
            fi

            # docs 디렉토리 체크아웃
            TMPDIR=$(mktemp -d)
            if ! gh api "repos/$ORG/$REPO/tarball/$TARGET_BRANCH" > "$TMPDIR/archive.tar.gz" 2>/dev/null; then
              echo "⚠️ $REPO: tarball 다운로드 실패 — 건너뜀"
              rm -rf "$TMPDIR"
              echo "::endgroup::"
              continue
            fi

            tar -xzf "$TMPDIR/archive.tar.gz" -C "$TMPDIR" 2>/dev/null
            EXTRACTED=$(find "$TMPDIR" -maxdepth 1 -type d -not -name "$(basename $TMPDIR)" | head -1)

            DOCS_PATH="$EXTRACTED/$DOCS_SUBDIR"
            if [ ! -d "$DOCS_PATH/workflow" ]; then
              echo "⚠️ $REPO: $DOCS_SUBDIR/workflow 디렉토리 없음 — 건너뜀"
              rm -rf "$TMPDIR"
              echo "::endgroup::"
              continue
            fi

            # 최신 커밋 SHA 확인
            LATEST_SHA=$(gh api "repos/$ORG/$REPO/commits/$TARGET_BRANCH" --jq '.sha' 2>/dev/null | head -c 7)

            # 이전 데이터와 비교하여 변경 여부 확인
            OLD_CHECKSUM=""
            if [ -f "data/$REPO.json" ]; then
              OLD_CHECKSUM=$(md5sum "data/$REPO.json" | cut -d' ' -f1)
            fi

            # 파서 실행
            GITHUB_SHA="$LATEST_SHA" GITHUB_ACTOR="sync-bot" \
              node scripts/parse-workflow.mjs "$DOCS_PATH" "$REPO" "data/$REPO.json"

            NEW_CHECKSUM=$(md5sum "data/$REPO.json" | cut -d' ' -f1)

            if [ "$FORCE" = "true" ] || [ "$OLD_CHECKSUM" != "$NEW_CHECKSUM" ]; then
              MARK=""
              [ "$FORCE" = "true" ] && MARK=" [force]"
              UPDATED+=("$REPO ($TARGET_BRANCH) from $LATEST_SHA$MARK")
              if [ "$FORCE" = "true" ]; then
                echo "✅ $REPO: 강제 동기화 — 업데이트됨"
              else
                echo "✅ $REPO: 데이터 변경 감지 — 업데이트됨"
              fi
            else
              echo "⏭️ $REPO: 변경 없음 — 건너뜀"
              # 변경 없으면 git checkout으로 복원
              git checkout -- "data/$REPO.json" 2>/dev/null || true
            fi

            rm -rf "$TMPDIR"
            echo "::endgroup::"
          done

          # 변경된 파일이 있으면 커밋
          if [ ${#UPDATED[@]} -gt 0 ]; then
            # 커밋 전 데이터 검증 — 잘못된 데이터가 main에 들어가지 않도록 차단 (set -e로 실패 시 잡 중단)
            npm run validate:data

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git add data/*.json

            if git diff --cached --quiet; then
              echo "ℹ️ force 트리거였으나 실제 변경 없음 — 커밋 건너뜀"
            else
              COMMIT_MSG="data: sync workflow data"
              for item in "${UPDATED[@]}"; do
                COMMIT_MSG="$COMMIT_MSG
            - update $item"
              done

              git commit -m "$COMMIT_MSG"
              git push

              echo "🚀 ${#UPDATED[@]}개 레포 데이터 업데이트 완료"

              # GITHUB_TOKEN으로 push한 commit은 다른 workflow를 자동 트리거하지 않으므로
              # Pages 재배포를 위해 Build & Deploy를 명시적으로 dispatch
              gh workflow run "Build & Deploy" --ref main \
                && echo "📦 Build & Deploy 트리거됨" \
                || echo "⚠️ Build & Deploy 트리거 실패"
            fi
          else
            echo "✅ 모든 레포 데이터 최신 상태 — 커밋 불필요"
          fi
